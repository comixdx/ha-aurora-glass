# Aurora Glass — frosted-glass themes for Home Assistant
# Put this file in /config/themes/ and make sure configuration.yaml has:
#   frontend:
#     themes: !include_dir_merge_named themes
# Then: Developer tools → Actions → frontend.reload_themes, and pick the theme in your profile.
#
# The themes also give Home Assistant's own dialogs (more-info, settings) the glass look.
#
# Optional: the Aurora Glass card already applies this look to its own dashboard
# (editor switch "Apply the glass theme to the whole dashboard"). Use this file only if you
# want the glass look on every dashboard and in the rest of the HA interface.

Aurora Glass:
  # Shared by both modes
  ha-card-border-radius: "28px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "30px"
  mdc-shape-medium: "20px"
  # Glass dialogs (more-info, settings, confirmations) and the phone bottom sheet
  ha-dialog-surface-backdrop-filter: "blur(38px) saturate(170%)"
  ha-dialog-scrim-backdrop-filter: "blur(7px)"
  dialog-backdrop-filter: "blur(7px)"
  ha-bottom-sheet-border-radius: "30px"
  state-climate-cool-color: "var(--ag-cool)"
  state-climate-heat-color: "var(--ag-heat)"
  energy-solar-color: "var(--ag-solar)"
  energy-battery-in-color: "var(--ag-battery)"
  energy-battery-out-color: "var(--ag-battery)"
  energy-grid-return-color: "var(--ag-grid)"
  error-color: "var(--ag-alert)"
  ha-card-backdrop-filter: "blur(24px) saturate(170%)"
  app-header-backdrop-filter: "blur(24px) saturate(170%)"
  # Sidebar
  sidebar-selected-text-color: "var(--primary-color)"
  sidebar-selected-icon-color: "var(--primary-color)"
  sidebar-menu-button-background-color: "transparent"
  sidebar-border-color: "var(--divider-color)"
  modes:
    dark:   # Midnight
      ag-cool: "#6cb6ff"
      ag-heat: "#ff8a66"
      ag-solar: "#f6c84a"
      ag-battery: "#5fdca6"
      ag-grid: "#b3a4ff"
      ag-alert: "#ff6b7f"
      primary-color: "#ffb27a"
      accent-color: "#ffb27a"
      state-light-active-color: "#ffb27a"
      primary-text-color: "#f2f4fb"
      secondary-text-color: "#aeb6cb"
      disabled-text-color: "#6f7790"
      text-primary-color: "#1c140c"
      primary-background-color: "#080c18"
      secondary-background-color: "#121729"
      app-header-background-color: "rgba(8,12,24,0.55)"
      app-header-text-color: "#f2f4fb"
      sidebar-background-color: "rgba(10,14,28,0.9)"
      bubble-backdrop-background-color: "rgba(4,6,14,0.55)"
      sidebar-text-color: "#aeb6cb"
      sidebar-icon-color: "#aeb6cb"
      sidebar-menu-button-text-color: "#f2f4fb"
      divider-color: "rgba(255,255,255,0.09)"
      card-background-color: "#121729"
      ha-card-background: "rgba(255,255,255,0.07)"
      ha-card-border-color: "rgba(255,255,255,0.13)"
      ha-card-box-shadow: "inset 0 1px 0 rgba(255,255,255,.16), 0 30px 60px -32px rgba(0,0,0,.55)"
      ha-dialog-surface-background: "rgba(8,12,24,0.66)"
      ha-bottom-sheet-surface-background: "rgba(8,12,24,0.66)"
      mdc-dialog-scrim-color: "rgba(4,6,14,0.45)"
      dialog-box-shadow: "inset 0 1px 0 rgba(255,255,255,.16), 0 40px 90px -30px rgba(0,0,0,.7)"
      state-switch-active-color: "#ffb27a"
      state-input_boolean-active-color: "#ffb27a"
      state-fan-active-color: "#6cb6ff"
      lovelace-background: >-
        radial-gradient(circle at 8% 0%, rgba(69,82,216,0.55), transparent 42%),
        radial-gradient(circle at 85% 35%, rgba(15,158,152,0.45), transparent 42%),
        radial-gradient(circle at 30% 100%, rgba(178,79,128,0.40), transparent 48%),
        #080c18 fixed
    light:  # Dawn
      ag-cool: "#2b74cc"
      ag-heat: "#d4552e"
      ag-solar: "#b4840a"
      ag-battery: "#178a5c"
      ag-grid: "#6450cf"
      ag-alert: "#cf3049"
      primary-color: "#c4602a"
      accent-color: "#c4602a"
      state-light-active-color: "#ff9a52"
      primary-text-color: "#151827"
      secondary-text-color: "#4c5369"
      disabled-text-color: "#8a90a3"
      text-primary-color: "#ffffff"
      primary-background-color: "#e9ecf4"
      secondary-background-color: "#f4f5fa"
      app-header-background-color: "rgba(255,255,255,0.55)"
      app-header-text-color: "#151827"
      sidebar-background-color: "rgba(244,245,250,0.92)"
      bubble-backdrop-background-color: "rgba(40,46,72,0.22)"
      sidebar-text-color: "#4c5369"
      sidebar-icon-color: "#4c5369"
      sidebar-menu-button-text-color: "#151827"
      divider-color: "rgba(20,24,40,0.08)"
      card-background-color: "#f7f8fc"
      ha-card-background: "rgba(255,255,255,0.48)"
      ha-card-border-color: "rgba(255,255,255,0.85)"
      ha-card-box-shadow: "inset 0 1px 0 rgba(255,255,255,.95), 0 30px 60px -32px rgba(55,65,110,.28)"
      ha-dialog-surface-background: "rgba(233,236,244,0.74)"
      ha-bottom-sheet-surface-background: "rgba(233,236,244,0.74)"
      mdc-dialog-scrim-color: "rgba(40,46,72,0.22)"
      dialog-box-shadow: "inset 0 1px 0 rgba(255,255,255,.95), 0 40px 90px -30px rgba(55,65,110,.4)"
      state-switch-active-color: "#ff9a52"
      state-input_boolean-active-color: "#ff9a52"
      state-fan-active-color: "#2b74cc"
      lovelace-background: >-
        radial-gradient(circle at 8% 0%, rgba(255,177,150,0.8), transparent 42%),
        radial-gradient(circle at 85% 35%, rgba(151,191,255,0.75), transparent 42%),
        radial-gradient(circle at 30% 100%, rgba(203,176,255,0.7), transparent 48%),
        #e9ecf4 fixed

