<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="330" rx="24" fill="#080c18"/>
  <text x="32" y="44" fill="#f2f4fb" font-size="16" font-weight="700">Wide screen · 12 columns</text>
  <g fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.08)">
    <rect x="32" y="60" width="60" height="150" rx="8"/><rect x="100" y="60" width="60" height="150" rx="8"/><rect x="168" y="60" width="60" height="150" rx="8"/><rect x="236" y="60" width="60" height="150" rx="8"/>
    <rect x="304" y="60" width="60" height="150" rx="8"/><rect x="372" y="60" width="60" height="150" rx="8"/><rect x="440" y="60" width="60" height="150" rx="8"/><rect x="508" y="60" width="60" height="150" rx="8"/>
    <rect x="576" y="60" width="60" height="150" rx="8"/><rect x="644" y="60" width="60" height="150" rx="8"/><rect x="712" y="60" width="60" height="150" rx="8"/><rect x="780" y="60" width="60" height="150" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1c140c">
    <rect x="32" y="68" width="808" height="30" rx="10" fill="#ffb27a"/><text x="48" y="88">XL — 12 columns (full width)</text>
    <rect x="32" y="106" width="400" height="30" rx="10" fill="#f3cf5e"/><text x="48" y="126">L — 6 columns</text>
    <rect x="440" y="106" width="400" height="30" rx="10" fill="#f3cf5e"/><text x="456" y="126">L</text>
    <rect x="32" y="144" width="264" height="30" rx="10" fill="#6fe0b0"/><text x="48" y="164">M — 4 (default)</text>
    <rect x="304" y="144" width="264" height="30" rx="10" fill="#6fe0b0"/><text x="320" y="164">M</text>
    <rect x="576" y="144" width="264" height="30" rx="10" fill="#6fe0b0"/><text x="592" y="164">M</text>
    <rect x="32" y="180" width="196" height="24" rx="8" fill="#7cc4ff"/><text x="48" y="197" font-size="13">S — 3</text>
    <rect x="236" y="180" width="196" height="24" rx="8" fill="#7cc4ff"/><text x="252" y="197" font-size="13">S</text>
    <rect x="440" y="180" width="196" height="24" rx="8" fill="#7cc4ff"/><text x="456" y="197" font-size="13">S</text>
    <rect x="644" y="180" width="196" height="24" rx="8" fill="#7cc4ff"/><text x="660" y="197" font-size="13">S</text>
  </g>
  <text x="32" y="248" fill="#f2f4fb" font-size="16" font-weight="700">Tablet · 6 columns</text>
  <text x="32" y="270" fill="#aeb6cb" font-size="13">S and M take half the width, L and XL the full width.</text>
  <g>
    <rect x="32" y="282" width="196" height="24" rx="8" fill="#6fe0b0"/><rect x="236" y="282" width="196" height="24" rx="8" fill="#7cc4ff"/>
  </g>
  <text x="480" y="248" fill="#f2f4fb" font-size="16" font-weight="700">Phone · 1 column</text>
  <text x="480" y="270" fill="#aeb6cb" font-size="13">Every widget is full width, in the same order.</text>
  <rect x="480" y="282" width="196" height="24" rx="8" fill="#ffb27a"/>
  <rect x="684" y="282" width="40" height="24" rx="8" fill="none" stroke="#aeb6cb" stroke-dasharray="4 4"/>
  <text x="736" y="299" fill="#aeb6cb" font-size="12">≤ 719 px wide</text>
</svg>
