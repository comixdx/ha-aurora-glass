<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Choose the Aurora Glass theme in your profile">
<title>Choose the Aurora Glass theme in your profile</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232a66"/><stop offset=".55" stop-color="#0d1226"/><stop offset="1" stop-color="#3a1f40"/></linearGradient>
<radialGradient id="g1" cx=".85" cy=".2" r=".6"><stop offset="0" stop-color="#2fd3b0" stop-opacity=".35"/><stop offset="1" stop-color="#2fd3b0" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".15" cy=".95" r=".6"><stop offset="0" stop-color="#d0509a" stop-opacity=".3"/><stop offset="1" stop-color="#d0509a" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect x="0" y="0" width="900" height="520" fill="url(#bg)"/><rect x="0" y="0" width="900" height="520" fill="url(#g1)"/><rect x="0" y="0" width="900" height="520" fill="url(#g2)"/>
<!-- top bar with the profile button -->
<rect x="16" y="14" width="868" height="56" rx="28" fill="#0b1024" stroke="#ffffff" stroke-width="1" fill-opacity="0.55" stroke-opacity="0.2"/>
<g transform="translate(46 42) scale(0.9)"><path d="M-10 -7H10M-10 0H10M-10 7H10" stroke="#eef2ff" stroke-width="2.2" stroke-linecap="round"/></g>
<g transform="translate(100 42) scale(0.85)"><rect x="-10" y="-10" width="9" height="12" rx="2" fill="#eef2ff"/><rect x="1" y="-10" width="9" height="7" rx="2" fill="#eef2ff"/><rect x="-10" y="4" width="9" height="6" rx="2" fill="#eef2ff"/><rect x="1" y="-1" width="9" height="11" rx="2" fill="#eef2ff"/></g>
<g transform="translate(156 42) scale(0.85)"><path d="M-10 -8 L-3 -11 L3 -8 L10 -11 V8 L3 11 L-3 8 L-10 11Z" fill="#eef2ff" opacity=".9"/></g>
<rect x="826" y="26" width="44" height="32" rx="16" fill="#ffb27a" fill-opacity=".28"/>
<circle cx="848" cy="42" r="14" fill="#ffb27a"/><text x="848" y="47" font-size="13" font-weight="700" fill="#1a1020" text-anchor="middle">A</text>
<circle cx="864" cy="24" r="13" fill="#ffb27a"/><text x="864" y="29" font-size="14" font-weight="700" fill="#1a1020" text-anchor="middle">1</text>
<!-- profile page -->
<text x="48" y="118" font-size="26" font-weight="700" fill="#eef2ff">Profile</text>
<text x="48" y="142" font-size="13" fill="#9aa6c7">General · Security</text>
<g filter="url(#sh)"><rect x="48" y="162" width="804" height="318" rx="22" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.2"/></g>
<text x="76" y="200" font-size="16" font-weight="600" fill="#eef2ff">Browser settings</text>
<text x="76" y="238" font-size="14" font-weight="600" fill="#eef2ff">Theme</text>
<text x="76" y="258" font-size="12" fill="#9aa6c7">Choose a theme or use the backend default.</text>
<rect x="540" y="220" width="280" height="48" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".28"/>
<text x="554" y="236" font-size="10.5" font-weight="500" fill="#9aa6c7">Theme</text>
<text x="554" y="256" font-size="14" fill="#eef2ff">Aurora Glass</text>
<path d="M794 240 l6 6 l6 -6" fill="none" stroke="#9aa6c7" stroke-width="2"/>
<rect x="536" y="216" width="288" height="56" rx="11" fill="none" stroke="#ffb27a" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="532" cy="228" r="13" fill="#ffb27a"/><text x="532" y="233" font-size="14" font-weight="700" fill="#1a1020" text-anchor="middle">2</text>
<!-- dark / light mode -->
<text x="76" y="318" font-size="14" font-weight="600" fill="#eef2ff">Mode</text>
<text x="76" y="338" font-size="12" fill="#9aa6c7">Auto follows your device: Midnight in dark mode, Dawn in light mode.</text>
<rect x="540" y="306" width="280" height="40" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".28"/>
<rect x="544" y="310" width="88" height="32" rx="16" fill="#ffb27a"/>
<text x="588" y="331" font-size="13" font-weight="700" fill="#1a1020" text-anchor="middle">Auto</text>
<text x="680" y="331" font-size="13" fill="#eef2ff" text-anchor="middle">Light</text>
<text x="770" y="331" font-size="13" fill="#eef2ff" text-anchor="middle">Dark</text>
<circle cx="532" cy="314" r="13" fill="#ffb27a"/><text x="532" y="319" font-size="14" font-weight="700" fill="#1a1020" text-anchor="middle">3</text>
<!-- the other themes -->
<text x="76" y="398" font-size="14" font-weight="600" fill="#eef2ff">Also in the file</text>
<rect x="76" y="414" width="190" height="40" rx="20" fill="#2fd3b0" fill-opacity=".18" stroke="#6fe0b0" stroke-opacity=".6"/>
<circle cx="98" cy="434" r="7" fill="#6fe0b0"/><text x="114" y="439" font-size="13" fill="#eef2ff">Aurora Glass Lagoon</text>
<rect x="282" y="414" width="190" height="40" rx="20" fill="#f3cf5e" fill-opacity=".15" stroke="#f3cf5e" stroke-opacity=".6"/>
<circle cx="304" cy="434" r="7" fill="#f3cf5e"/><text x="320" y="439" font-size="13" fill="#eef2ff">Aurora Glass Ember</text>
</svg>
