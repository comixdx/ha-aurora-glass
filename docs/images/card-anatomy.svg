      <rect x="706" y="164" width="110" height="52" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/>
      <rect x="466" y="224" width="110" height="52" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/>
      <rect x="586" y="224" width="110" height="52" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/>
      <rect x="706" y="224" width="110" height="52" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/>
      <circle cx="484" cy="182" r="9" fill="#ffb27a"/><circle cx="604" cy="182" r="9" fill="#ffb27a"/>
    </g>
