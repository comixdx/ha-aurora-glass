ry_soc</text><path d="M556 227 l6 6 l6 -6" fill="none" stroke="#9aa6c7" stroke-width="2"/><rect x="44" y="266" width="262" height="46" rx="8" fill="#ffffff" stroke="#ffffff" stroke-width="1" fill-opacity=".05" stroke-opacity=".28"/><text x="56" y="281" font-size="10.5" font-weight="500" fill="#9aa6c7" text-anchor="start" opacity="1">Inverter power</text><text x="56" y="300" font-size="14" font-weight="400" fill="#eef2ff" text-anchor="start" opacity="1">sensor.inverter_power</text><path d="M280 285 l6 6 l6 -6" fill="none" stroke="#9aa6c7" stroke-width="2"/><rect x="320" y="266" width="262" height="46" rx="8" fill="#ffffff" stroke="#ffffff" stroke-width="1" fill-opacity=".05" stroke-opacity=".28"/><text x="332" y="281" font-size="10.5" font-weight="500" fill="#9aa6c7" text-anchor="start" opacity="1">Inverter status</text><text x="332" y="300" font-size="14" font-weight="400" fill="#eef2ff" text-anchor="start" opacity="1">sensor.inverter_work_mode</text><path d="M556 285 l6 6 l6 -6" fill="none" stroke="#9aa6c7" stroke-width="2"/><rect x="44" y="324" width="262" height="46" rx="8" fill="#ffffff" stroke="#ffffff" stroke-width="1" fill-opacity=".05" stroke-opacity=".28"/><text x="56" y="339" font-size="10.5" font-weight="500" fill="#9aa6c7" text-anchor="start" opacity="1">Inverter temperature</text><text x="56" y="358" font-size="14" font-weight="400" fill="#eef2ff" text-anchor="start" opacity="1">sensor.inverter_temp</text><path d="M280 343 l6 6 l6 -6" fill="none" stroke="#9aa6c7" stroke-width="2"/><circle cx="36" cy="172" r="13" fill="#ffb27a" stroke="none" stroke-width="1" /><text x="36" y="177" font-size="14" font-weight="700" fill="#1a1020" text-anchor="middle" opacity="1">3</text><text x="44" y="420" font-size="13" font-weight="400" fill="#eef2ff" text-anchor="start" opacity="1">Battery sensor is positive when discharging</text><rect x="556" y="404" width="38" height="22" rx="11" fill="#ffb27a" stroke="none" stroke-width="1" fill-opacity="1"/><circle cx="583" cy="41