="124" font-size="12" font-weight="400" fill="#9aa6c7" text-anchor="middle" opacity="1">Thu</text><g transform="translate(478 142) scale(0.9)"><path d="M-9 6 A6 6 0 0 1 -6 -5 A8 8 0 0 1 9 -2 A5 5 0 0 1 8 6Z" fill="#c8d4f0"/></g><text x="478" y="168" font-size="13" font-weight="600" fill="#eef2ff" text-anchor="middle" opacity="1">9°</text>
