<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 234" width="576" height="234" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Weather widget">
<title>Weather widget</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232a66"/><stop offset=".55" stop-color="#0d1226"/><stop offset="1" stop-color="#3a1f40"/></linearGradient>
