# Aurora Glass — example dashboard (Settings → Dashboards → ⋮ → Raw configuration editor)
# Replace the entity IDs with yours. Unused widgets can simply be deleted.
#
# Also included:
#   • Kiosk mode — guests get a clean, full-screen dashboard without the sidebar and top bar;
#     admins keep them. Needs kiosk-mode (HACS → Frontend).
#   • A small power menu next to the Customize button: one round button opens a glass menu
#     in the middle of the screen with Restart Home Assistant, Reboot host and Shut down
#     (each asks for confirmation), next to a logout button. Needs Bubble Card (HACS → Frontend).
#     With the Aurora Glass theme the page behind the menu dims to the theme's own tint.
#     Replace YOUR_ADMIN_USER_ID with your user id (Settings → People → Users → open the user;
#     the id is in the address bar). Only the users listed see the power button and the menu.
#     Restart, reboot and shut down only work for administrator accounts.
#     Don't use the power menu? Delete header_buttons and the bubble-card pop-up below.

kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_header: true
  admin_settings:
    hide_sidebar: false
    hide_header: false

title: Acasă
views:
  - title: Acasă
    path: home
    icon: mdi:home
    type: panel              # full width; the card has its own glass background
    cards:
      # A Panel view shows one card, so the Aurora Glass card and the power pop-up
      # sit together in one vertical stack.
      - type: vertical-stack
        cards:
          - type: custom:aurora-glass-card
            # preset: auto        # auto (follows HA dark/light) | midnight | dawn | lagoon | ember
            # accent: peach       # peach | gold | mint | sky | lilac
            # blur: 24            # px, 0–40
            # motion: true
            # language: ro        # default: your HA profile language
            min_height: 100vh
            # Small round buttons next to the Customize button
            header_buttons:
              - icon: mdi:logout
                name: Log out
                tap_action:
                  action: navigate
                  navigation_path: /profile
              - icon: mdi:power
                name: Power
                users: &power_users       # who sees the power button (or use  admin_only: true)
                  - YOUR_ADMIN_USER_ID
                tap_action:
                  action: navigate
                  navigation_path: "#power"
            chips:
              - { entity: sensor.living_room_temperature, name: Inside, color: cool }
              - { entity: sensor.pv_power, name: Solar, color: solar }
              - { entity: sensor.house_consumption, name: Using }
            widgets:
              - type: energy
                size: L
                solar_power: sensor.pv_power
                home_power: sensor.house_consumption       # optional, computed if missing
                battery_power: sensor.battery_power
                battery_soc: sensor.battery_state_of_charge
                grid_power: sensor.active_power
                invert_battery: true   # GoodWe reports discharge as positive
                invert_grid: true      # GoodWe active_power is + when exporting
              - type: lights
                size: L
                entities:
                  - { entity: light.living_room_ceiling, subtitle: Living room }
                  - { entity: light.living_room_sofa_lamp, name: Sofa lamp, subtitle: Living room }
                  - { entity: light.bedroom_bedside, subtitle: Bedroom }
                  - { entity: light.kitchen_worktop, subtitle: Kitchen }
                  - { entity: light.bathroom_mirror, subtitle: Bathroom }
                  - { entity: light.hallway, subtitle: Hallway }
              - type: climate
                entity: climate.living_room_ac
                title: Living room
                # modes: [cool, heat, dry, off]
              - type: scenes
                entities:
                  - { entity: scene.good_morning, description: "Lights at 80%, bedroom stays dark" }
                  - { entity: scene.evening, description: "Soft 30% lights, AC to 23°" }
                  - { entity: scene.away, description: "Everything off, heating low" }
                  - { entity: script.night, description: "Hallway dim, bedroom AC only" }
              - type: media
                entity: media_player.living_room
                subtitle: Living room
              - type: fan
                size: S
                entity: fan.bedroom
              - type: floor
                size: S
                entity: climate.bathroom_floor     # or a switch / input_boolean
                temperature: sensor.bathroom_floor_temperature
                subtitle: Bathroom
              - type: security
                size: S
                lock: lock.front_door
                sensors: [binary_sensor.kitchen_window, binary_sensor.bedroom_window]
              - type: weather
                size: S
                source: open_meteo       # built-in, free; or remove this line and set  entity: weather.home

          # The menu (a Bubble Card pop-up opened by the #power link), in the middle of the
          # screen and styled from the theme, so it follows dark/light mode and every preset.
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#power"
            name: Power
            icon: mdi:power
            visibility:
              - condition: user
                users: *power_users
            popup_mode: centered
            width_desktop: 420px
            bg_blur: 24
            shadow_opacity: 0
            styles: |
              .bubble-pop-up {
                --bubble-pop-up-main-background-color: color-mix(in srgb, var(--primary-background-color) 66%, transparent);
                --bubble-pop-up-border-radius: var(--ha-card-border-radius, 28px);
                font-family: 'Figtree', var(--ha-font-family-body, system-ui), sans-serif;
              }
              .bubble-pop-up-background {
                border: 1px solid var(--ha-card-border-color, rgba(255,255,255,0.13));
                box-shadow: var(--ha-card-box-shadow, none);
              }
              .bubble-header-container {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
              .bubble-button-card-container {
                background: var(--ha-card-background, rgba(255,255,255,0.07)) !important;
                border: 1px solid var(--ha-card-border-color, rgba(255,255,255,0.13));
                border-radius: 20px !important;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
              }
              .bubble-name {
                color: var(--primary-text-color) !important;
                font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
                font-weight: 600 !important;
              }
              .bubble-icon-container { background: color-mix(in srgb, var(--primary-color) 18%, transparent) !important; }
              .bubble-icon { color: var(--primary-color) !important; }
              .bubble-close-button {
                background: var(--ha-card-background, rgba(255,255,255,0.07)) !important;
                border: 1px solid var(--ha-card-border-color, rgba(255,255,255,0.13));
              }
              .bubble-close-button, .bubble-close-button ha-icon { color: var(--primary-text-color) !important; }
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Restart Home Assistant
                icon: mdi:home-assistant
                styles: &menu_button |
                  .bubble-button-card-container {
                    --ag: var(--primary-color);
                    background: var(--ha-card-background, rgba(255,255,255,0.07)) !important;
                    border: 1px solid var(--ha-card-border-color, rgba(255,255,255,0.13));
                    border-radius: 20px !important;
                    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
                    font-family: 'Figtree', var(--ha-font-family-body, system-ui), sans-serif;
                  }
                  .bubble-name { color: var(--primary-text-color) !important; font-weight: 600 !important; }
                  .bubble-icon-container { background: color-mix(in srgb, var(--ag) 18%, transparent) !important; }
                  .bubble-icon { color: var(--ag) !important; }
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.restart
                  confirmation:
                    text: Restart Home Assistant?
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Reboot host
                icon: mdi:restart
                styles: *menu_button
                tap_action:
                  action: perform-action
                  perform_action: hassio.host_reboot
                  confirmation:
                    text: Reboot the Home Assistant host?
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Shut down
                icon: mdi:power
                styles: |   # like the others, with the theme's alert colour
                  .bubble-button-card-container {
                    --ag: var(--error-color);
                    background: var(--ha-card-background, rgba(255,255,255,0.07)) !important;
                    border: 1px solid var(--ha-card-border-color, rgba(255,255,255,0.13));
                    border-radius: 20px !important;
                    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
                    font-family: 'Figtree', var(--ha-font-family-body, system-ui), sans-serif;
                  }
                  .bubble-name { color: var(--primary-text-color) !important; font-weight: 600 !important; }
                  .bubble-icon-container { background: color-mix(in srgb, var(--ag) 18%, transparent) !important; }
                  .bubble-icon { color: var(--ag) !important; }
                tap_action:
                  action: perform-action
                  perform_action: hassio.host_shutdown
                  confirmation:
                    text: Shut down Home Assistant?
