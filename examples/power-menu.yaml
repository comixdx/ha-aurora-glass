# Aurora Glass — small power menu in the top-right corner
#
# One round power button opens a small glass menu with Restart Home Assistant,
# Reboot host and Shut down (each asks for confirmation). A logout button sits next to it.
#
# Needs (HACS → Frontend): card-mod and Bubble Card.
# Use it as a Panel view: the vertical stack holds the Aurora Glass card, the floating
# buttons and the pop-up, so the view still has a single card.
#
# Replace YOUR_ADMIN_USER_ID with your user id (Settings → People → Users → open the user;
# the id is in the address bar). Only that user sees the power button and the menu.

type: vertical-stack
cards:
  - type: custom:aurora-glass-card
    min_height: 100vh
    widgets:
      - type: weather
        source: open_meteo

  # Floating buttons, top right, just under Home Assistant's top bar
  - type: horizontal-stack
    card_mod:
      style: |
        :host {
          position: fixed;
          top: calc(var(--header-height, 56px) + 10px);
          right: 16px;
          z-index: 999;
          width: auto;
          height: auto !important;
          bottom: auto;
          --stack-card-gap: 6px;
          --horizontal-stack-card-gap: 6px;
        }
    cards:
      - type: button
        icon: mdi:logout
        show_name: false
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /profile
        card_mod: &round
          style: |
            :host { display: block; width: 32px; height: 32px; }
            ha-card {
              min-height: 32px; padding: 0 !important; display: flex; align-items: center; justify-content: center;
              width: 32px; height: 32px; border-radius: 50%;
              --mdc-icon-size: 16px;
              background: rgba(255,255,255,0.12);
              backdrop-filter: blur(8px);
              border: none; box-shadow: none;
            }
      - type: button
        icon: mdi:power
        show_name: false
        show_state: false
        tap_action:
          action: navigate
          navigation_path: "#power"
        visibility: &admin_only
          - condition: user
            users:
              - YOUR_ADMIN_USER_ID
        card_mod: *round

  # The menu (a Bubble Card pop-up opened by the #power link)
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#power"
    name: Power
    icon: mdi:power
    visibility: *admin_only
    bg_color: "#080c18"
    bg_opacity: 70
    bg_blur: 24
    shadow_opacity: 0
    width_desktop: 420px
    margin_top_desktop: calc(100vh - 360px)
    margin_top_mobile: calc(100vh - 340px)
    styles: &menu_text |
      .bubble-name, .bubble-icon, .bubble-close-button, ha-icon { color: #f2f4fb !important; }
      .bubble-button-card-container, .bubble-close-button { background: rgba(255,255,255,0.08) !important; }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Restart Home Assistant
        icon: mdi:home-assistant
        styles: *menu_text
        tap_action:
          action: perform-action
          perform_action: homeassistant.restart
          confirmation:
            text: Restart Home Assistant?
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Reboot host
        icon: mdi:restart
        styles: *menu_text
        tap_action:
          action: perform-action
          perform_action: hassio.host_reboot
          confirmation:
            text: Reboot the Home Assistant host?
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Shut down
        icon: mdi:power
        styles: *menu_text
        tap_action:
          action: perform-action
          perform_action: hassio.host_shutdown
          confirmation:
            text: Shut down Home Assistant?
